<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d5a43"/>
      <stop offset="100%" stop-color="#1e3f2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#11100e" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle 3x3 editorial tile grid hint -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="#f5efe4" filter="url(#shadow)"/>
  <rect x="78" y="78" width="356" height="356" rx="52" fill="#fffcf5" stroke="#cbbca4" stroke-width="6"/>
  <!-- Warm shift accent bar -->
  <rect x="116" y="346" width="280" height="22" rx="11" fill="#b85234"/>
  <!-- Shift arrows -->
  <polygon points="104,357 128,341 128,373" fill="#fffcf5"/>
  <polygon points="408,357 384,341 384,373" fill="#fffcf5"/>
  <!-- Tactile serif letterform -->
  <text x="256" y="294" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="214" font-weight="700" fill="#211e19" letter-spacing="-8">O!</text>
</svg>
